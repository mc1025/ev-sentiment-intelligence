<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>EV Sentiment Intelligence — Pipeline Architecture</title>
<desc>Pipeline diagram showing data flow from NewsAPI through ETL stages, Supabase PostgreSQL, and Plotly Dash dashboard</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; font-weight: 400; fill: #6B7280; }
    .arr { stroke: #9CA3AF; stroke-width: 1.5; fill: none; }

    .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue   text { fill: #0C447C; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple text { fill: #3C3489; }
    .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber  text { fill: #633806; }
    .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal   text { fill: #085041; }
    .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral  text { fill: #712B13; }
    .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray   text { fill: #444441; }
  </style>
</defs>

<!-- Title -->
<text class="th" x="340" y="32" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#111827;">EV Sentiment Intelligence — Pipeline Architecture</text>

<!-- Stage 1: NewsAPI -->
<g class="c-blue">
  <rect x="30" y="60" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="100" y="84" text-anchor="middle" dominant-baseline="central">NewsAPI</text>
  <text class="ts" x="100" y="102" text-anchor="middle" dominant-baseline="central">13 queries · 5 brands</text>
</g>
<g class="c-blue">
  <rect x="30" y="132" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="ts" x="100" y="150" text-anchor="middle" dominant-baseline="central">100 articles/query</text>
  <text class="ts" x="100" y="166" text-anchor="middle" dominant-baseline="central">English · last 30 days</text>
</g>

<!-- Arrow 1→2 -->
<line x1="172" y1="104" x2="198" y2="104" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 2: Extract -->
<g class="c-purple">
  <rect x="200" y="60" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="260" y="84" text-anchor="middle" dominant-baseline="central">Extract</text>
  <text class="ts" x="260" y="102" text-anchor="middle" dominant-baseline="central">Stage 1</text>
</g>

<!-- Arrow 2→3 -->
<line x1="322" y1="88" x2="348" y2="88" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 3: Transform -->
<g class="c-purple">
  <rect x="350" y="60" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="410" y="80" text-anchor="middle" dominant-baseline="central">Transform</text>
  <text class="ts" x="410" y="96" text-anchor="middle" dominant-baseline="central">Stage 2</text>
  <text class="ts" x="410" y="110" text-anchor="middle" dominant-baseline="central">VADER scoring</text>
</g>

<!-- Arrow 3→4 -->
<line x1="472" y1="88" x2="498" y2="88" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 4: Validate -->
<g class="c-amber">
  <rect x="500" y="60" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="80" text-anchor="middle" dominant-baseline="central">Validate</text>
  <text class="ts" x="560" y="96" text-anchor="middle" dominant-baseline="central">Stage 3</text>
  <text class="ts" x="560" y="110" text-anchor="middle" dominant-baseline="central">9 quality checks</text>
</g>

<!-- Arrow 4 down to Load -->
<line x1="560" y1="118" x2="560" y2="185" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 5: Load -->
<g class="c-teal">
  <rect x="460" y="187" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="207" text-anchor="middle" dominant-baseline="central">Load to Supabase</text>
  <text class="ts" x="560" y="225" text-anchor="middle" dominant-baseline="central">Stage 4 · URL dedup key</text>
</g>

<!-- Arrow Load → DB -->
<line x1="560" y1="245" x2="560" y2="300" class="arr" marker-end="url(#arrow)"/>

<!-- Supabase DB -->
<g class="c-teal">
  <rect x="400" y="302" width="320" height="90" rx="10" stroke-width="0.5"/>
  <text class="th" x="560" y="326" text-anchor="middle" dominant-baseline="central">Supabase PostgreSQL</text>
  <text class="ts" x="480" y="348" text-anchor="middle" dominant-baseline="central">articles</text>
  <text class="ts" x="560" y="348" text-anchor="middle" dominant-baseline="central">brand_summary</text>
  <text class="ts" x="648" y="348" text-anchor="middle" dominant-baseline="central">events</text>
  <text class="ts" x="560" y="368" text-anchor="middle" dominant-baseline="central">900+ rows · 5 brands · 15 columns</text>
</g>

<!-- Arrow DB → Analytics Prep -->
<line x1="450" y1="394" x2="380" y2="430" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 6: Analytics Prep -->
<g class="c-purple">
  <rect x="200" y="430" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="290" y="450" text-anchor="middle" dominant-baseline="central">Analytics prep</text>
  <text class="ts" x="290" y="466" text-anchor="middle" dominant-baseline="central">Stage 5 · summary tables</text>
</g>

<!-- Arrow Prep → Dashboard -->
<line x1="290" y1="430" x2="290" y2="394" class="arr" marker-end="url(#arrow)"/>

<!-- Plotly Dash Dashboard -->
<g class="c-coral">
  <rect x="30" y="302" width="320" height="90" rx="10" stroke-width="0.5"/>
  <text class="th" x="190" y="326" text-anchor="middle" dominant-baseline="central">Plotly Dash dashboard</text>
  <text class="ts" x="120" y="348" text-anchor="middle" dominant-baseline="central">Trend chart</text>
  <text class="ts" x="190" y="348" text-anchor="middle" dominant-baseline="central">KPI cards</text>
  <text class="ts" x="268" y="348" text-anchor="middle" dominant-baseline="central">Articles table</text>
  <text class="ts" x="190" y="368" text-anchor="middle" dominant-baseline="central">http://127.0.0.1:8050</text>
</g>

<!-- Arrow DB → Dashboard -->
<line x1="400" y1="345" x2="352" y2="345" class="arr" marker-end="url(#arrow)"/>

<!-- Scheduler -->
<g class="c-gray">
  <rect x="30" y="430" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="105" y="450" text-anchor="middle" dominant-baseline="central">Scheduler</text>
  <text class="ts" x="105" y="466" text-anchor="middle" dominant-baseline="central">Daily 06:00 · auto ETL</text>
</g>

<!-- Scheduler dashed arrow back to NewsAPI -->
<path d="M105 430 L105 154" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="30" y="500" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="46" y="511">Data source</text>
<rect x="130" y="500" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="146" y="511">ETL stages</text>
<rect x="230" y="500" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="246" y="511">Validation</text>
<rect x="320" y="500" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="336" y="511">Database</text>
<rect x="405" y="500" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="421" y="511">Dashboard</text>
<rect x="490" y="500" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="506" y="511">Scheduler</text>

</svg>
